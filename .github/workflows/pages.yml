name: Publish learning course

on:
  push:
    branches: [main]
    paths:
      - 'courses/**'
      - 'notes/**'
      - 'assets/fonts/**'
      - 'scripts/build_course.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: course-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only reviewed public files
        run: python3 -B scripts/build_course.py --stage-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .state/course-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
